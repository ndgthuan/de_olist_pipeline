[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-olist-pipeline"
version = "0.1.0"
description = "Batch data pipeline on the Olist Brazilian e-commerce dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow",
    "requests",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
